apiVersion: v1
kind: ConfigMap
metadata:
  name: tradflow-config
data:
  APP_NAME: "tradflow-ai-agent"
  ENV: "prod"
  LOG_LEVEL: "INFO"
  LLM_PROVIDER: "openai"
  LLM_MODEL: "gpt-4"
  DB_HOST: "postgres.default.svc.cluster.local"
  DB_PORT: "5432"
  REDIS_HOST: "redis.default.svc.cluster.local"
  REDIS_PORT: "6379"