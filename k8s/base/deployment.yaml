apiVersion: apps/v1
kind: Deployment
metadata:
  name: tradflow-api
  labels:
    app: tradflow-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: tradflow-api
  template:
    metadata:
      labels:
        app: tradflow-api
    spec:
      containers:
        - name: api
          image: tradflow-ai-agent:latest
          ports:
            - containerPort: 8000
          env:
            - name: ENV
              value: "prod"
            - name: LOG_LEVEL
              value: "INFO"
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10